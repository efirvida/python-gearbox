[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-gearbox"
version = "0.2.0.dev0"
description = "Strength calculation (ISO 6336, AGMA 2001) and geometry export for spur, helical, double helical and internal gears"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Eduardo M. Firvida Donestevez", email = "efirvida@gmail.com" }]
requires-python = ">=3.10"
keywords = ["gearbox", "gear", "agma", "iso", "iso-6336", "gear transmission", "engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "scipy>=1.15.3", "jinja2>=3.0"]

[project.optional-dependencies]
fem = ["gmsh>=4.15.2"]
dev = ["pytest>=9.1.1", "pytest-cov", "ruff", "gmsh>=4.15.2"]

[project.urls]
Homepage = "https://github.com/efirvida/python-gearbox"
Issues = "https://github.com/efirvida/python-gearbox/issues"
Changelog = "https://github.com/efirvida/python-gearbox/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/gearbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/golden", "demo", "docs_sphinx_old"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D"]
ignore = ["D203", "D213", "D105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D", "E501"]
